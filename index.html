<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Opening ERYDON</title>
  <script>
    (() => {
      const incoming = new URL(window.location.href);
      const marker = "_erydon_www";
      const returning = incoming.searchParams.get(marker) === "20261026";
      const destination = new URL(returning
        ? "https://erydon-v1-6.oliesharp.chatgpt.site/"
        : "https://www.erydon.co.uk/");
      destination.pathname = ["/index.html", "/docs/index.html"].includes(incoming.pathname)
        ? "/" : incoming.pathname;
      destination.search = incoming.search;
      destination.hash = incoming.hash;
      if (returning) destination.searchParams.delete(marker);
      else destination.searchParams.set(marker, "20261026");
      window.location.replace(destination.href);
    })();
  </script>
  <style>
    html { color-scheme: dark; background: #080808; color: #f5f0e5; font: 1rem/1.6 system-ui, sans-serif; }
    body { min-height: 90vh; margin: 0; padding: 1.5rem; display: grid; place-items: center; text-align: center; }
    h1 { font: 400 2rem/1.2 Georgia, serif; color: #c8a56a; }
    a { color: #e1c692; text-underline-offset: .25em; }
    a:focus-visible { outline: 2px solid #e1c692; outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>ERYDON</h1>
    <p>Opening the website.</p>
    <a href="https://www.erydon.co.uk/?_erydon_www=20261026">Continue to the website</a>
    <noscript><p>If this returns here, <a href="https://erydon-v1-6.oliesharp.chatgpt.site/">use the alternate address</a>.</p></noscript>
  </main>
</body>
</html>
